<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            Hauptraum
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="button-grid">
            <button matButton="outlined">
                <mat-icon>lock_open</mat-icon>
                Open Inside
            </button>
            <button matButton="outlined">
                <mat-icon>lock_open</mat-icon>
                Open Outside
            </button>
            <button matButton="outlined" class="grid-span">
                <mat-icon>lock_closed</mat-icon>
                Close All
            </button>
        </div>
    </mat-card-content>
</mat-card>
